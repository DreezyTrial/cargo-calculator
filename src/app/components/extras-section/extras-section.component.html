<section class="cc-section">
  <h2 class="cc-section__title cc-section__title--tight">
    <span class="cc-section__step">4</span>
    <span>Додаткові послуги</span>
  </h2>
  <div class="cc-extra-grid">
    <label class="cc-extra">
      <input class="cc-checkbox" type="checkbox" [ngModel]="state.needPacking()" (ngModelChange)="state.needPacking.set($event)" />
      <span class="cc-extra__text">Упаковка (+{{ extras.packing }} грн)</span>
    </label>
    <label class="cc-extra">
      <input class="cc-checkbox" type="checkbox" [ngModel]="state.needAssembly()" (ngModelChange)="state.needAssembly.set($event)" />
      <span class="cc-extra__text">Складання меблів (+{{ extras.assembly }} грн)</span>
    </label>
    <label class="cc-extra cc-extra--wide">
      <input class="cc-checkbox" type="checkbox" [ngModel]="state.isHeavyItem()" (ngModelChange)="state.isHeavyItem.set($event)" />
      <span class="cc-extra__text">Сейф/Піаніно (+{{ extras.heavyItem }} грн)</span>
    </label>
  </div>
</section>
